name: CI

on:
  workflow_dispatch:
    inputs:
      template:
        description: Also rename and verify both starter variants (slow)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev webkit2gtk-driver xvfb dbus-x11
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run verify:config
      - run: pnpm run package
      - run: dbus-run-session -- xvfb-run -a pnpm run smoke
      - run: cargo install tauri-driver --locked
      - run: dbus-run-session -- xvfb-run -a pnpm run test:e2e
      - name: Rename and verify both starter variants (opt in)
        if: inputs.template
        run: dbus-run-session -- xvfb-run -a pnpm run test:template

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - run: pnpm run smoke
